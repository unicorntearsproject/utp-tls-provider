# cargo-deny policy for utp-tls-provider: `cargo deny check` from this folder.

[graph]
targets = ["x86_64-unknown-none", "x86_64-unknown-linux-gnu"]
# Test-only crates (a `ring` server, certificate generation) are not shipped.
exclude-dev = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The reason this crate exists: nothing that signs with RSA is built.
deny = [
    { name = "rsa" },
    { name = "num-bigint-dig" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
